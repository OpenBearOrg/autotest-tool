name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build release artifact
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify Oracle JDBC is not bundled
        run: ./scripts/check-no-bundled-ojdbc.sh
      - name: Build and inspect release container
        run: |
          docker build --tag autotest-tool:release-check .
          docker run --rm --entrypoint sh autotest-tool:release-check -c \
            'if find / -type f -iname "ojdbc*.jar" 2>/dev/null | grep -q .; then
               echo "ERROR: Oracle JDBC detected in Docker image" >&2
               exit 1
             fi'
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/openbearorg/autotest-tool
          tags: |
            type=ref,event=tag
            type=raw,value=stable
      - name: Build and publish container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
