name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build release artifact
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify Oracle JDBC is not bundled
        run: ./scripts/check-no-bundled-ojdbc.sh
      - name: Build and inspect release container
        run: |
          docker build --tag autotest-tool:release-check .
          docker run --rm --entrypoint sh autotest-tool:release-check -c \
            'if find / -type f -iname "ojdbc*.jar" 2>/dev/null | grep -q .; then
               echo "ERROR: Oracle JDBC detected in Docker image" >&2
               exit 1
             fi'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/openbearorg/autotest-tool
          tags: |
            type=ref,event=tag
            type=raw,value=stable
      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
