name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Maven wrapper
        run: ./mvnw --version
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify Oracle JDBC is not bundled
        run: ./scripts/check-no-bundled-ojdbc.sh
      - name: Install reactor artifacts for SBOM generation
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests
      - name: Generate dependency SBOM
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DskipTests
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-sbom
          path: |
            target/bom.json
            target/bom.xml
      - name: Build container
        run: docker compose --progress=plain build
      - name: Verify container excludes Oracle JDBC
        run: >-
          docker run --rm --entrypoint sh autotest-tool:stable -c
          'if find / -type f -iname "ojdbc*.jar" 2>/dev/null | grep -q .; then
          echo "ERROR: Oracle JDBC detected in Docker image" >&2; exit 1; fi'
      - name: Smoke-test container
        run: |
          docker compose run --rm autotest-tool version
          docker compose run --rm autotest-tool validate --workspace /workspace

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
